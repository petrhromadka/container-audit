name: Security scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Audit sample and write SARIF
        run: uv run python -m ca --input tests/fixtures/sample_inspect.json --format sarif > results.sarif
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: results.sarif
