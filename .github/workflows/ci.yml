name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src
      - run: uv run pytest

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t container-audit:ci .
      - name: Smoke test on empty input
        run: |
          set -euo pipefail
          docker inspect $(docker ps -aq) > /tmp/empty.json || echo "[]" > /tmp/empty.json
          echo "[]" | docker run --rm -i container-audit:ci --input /dev/stdin

  live-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync
      - name: Start an insecure container
        run: |
          set -euo pipefail
          docker run -d --name victim --privileged \
            -e DB_PASSWORD=hunter2 \
            -p 0.0.0.0:6400:6379 \
            redis:7
      - name: Audit it live
        run: |
          set -euo pipefail
          uv run python -m ca --include-host | tee audit.txt
          grep -q privileged audit.txt
          grep -q secret-in-env audit.txt
          grep -q port-all-interfaces audit.txt
      - name: Clean up
        if: always()
        run: docker rm -f victim
